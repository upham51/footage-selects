name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        # Ubuntu's ffmpeg is used only to make and read test clips here; the
        # app ships its own LGPL build (scripts/build-ffmpeg.sh).
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run engine tests
        run: cargo test -p selects_engine --release

  waitlist:
    name: Waitlist page and Worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node --check ../site/site.js && node --check ../site/landing.js && node --check ../site/fs-signal.js && node --check ../site/motion.js && node --check ../site/admin.js

  app-check:
    name: App compiles (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - name: Placeholder sidecars (the real ones are fetched only for releases)
        run: |
          T=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ffmpeg-$T src-tauri/binaries/ffprobe-$T
      - name: Check the app builds and its tests pass
        run: cargo test -p footage-selects
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the window script parses
        run: node --check ui/app.js
      - name: Check THIRD_PARTY_LICENSES is current and nothing needs a license review
        run: node scripts/third-party-licenses.mjs --check
      - name: Test the release scripts
        run: node --test scripts/write-update-manifest.test.mjs
