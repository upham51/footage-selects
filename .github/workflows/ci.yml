name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run engine tests
        run: cargo test -p selects_engine --release

  app-check:
    name: App compiles (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - name: Placeholder sidecars (the real ones are fetched only for releases)
        run: |
          T=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ffmpeg-$T src-tauri/binaries/ffprobe-$T
      - name: Check the app builds
        run: cargo check -p footage-selects
      - name: Check the window script parses
        run: node --check ui/app.js
