name: Release

# Builds the installers. A tag starting with v (for example v0.1.0) also
# attaches them to the GitHub release for that tag, creating it if needed.
#
# Running it by hand from the Actions tab builds the installers. With
# "publish" ticked it also creates the tag v<version> (the version in
# src-tauri/tauri.conf.json) on the commit it ran on, and the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the tag and release for the version in tauri.conf.json"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ffmpeg-windows:
    name: Build ffmpeg for Windows (LGPL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-out
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Install the cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nasm
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh windows ffmpeg-out
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-out
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: ffmpeg-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
            asset_suffix: mac-apple-silicon.dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
            asset_suffix: windows-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      # Optional. Without these the app is built without self-updating.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build ffmpeg for macOS (LGPL), or reuse the last build
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        id: ffcache
        with:
          path: ffmpeg-out
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh macos ffmpeg-out

      - name: Fetch the Windows ffmpeg built above
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-out

      - name: Put ffmpeg where the app and the tests expect it
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p src-tauri/binaries dev-bin
          for tool in ffmpeg ffprobe; do
            cp "ffmpeg-out/$tool$ext" "src-tauri/binaries/$tool-${{ matrix.target }}$ext"
            cp "ffmpeg-out/$tool$ext" "dev-bin/$tool$ext"
          done
          chmod +x dev-bin/* src-tauri/binaries/* || true
          cat ffmpeg-out/BUILD_INFO.txt
          cp ffmpeg-out/BUILD_INFO.txt src-tauri/ffmpeg-build-info.txt
          # Second license gate, on the finished program itself.
          dev-bin/ffmpeg$ext -hide_banner -L | head -5
          if dev-bin/ffmpeg$ext -hide_banner -buildconf | grep -E -- '--enable-(gpl|nonfree|version3)'; then
            echo "This ffmpeg was built with GPL or non-free parts and must not ship."; exit 1
          fi
          dev-bin/ffmpeg$ext -hide_banner -hwaccels
          # The fast decoding paths must be in the build, or analysis quietly runs in software.
          if [ "${{ runner.os }}" = "macOS" ]; then
            dev-bin/ffmpeg -hide_banner -hwaccels | grep -qw videotoolbox || { echo "This ffmpeg cannot decode with VideoToolbox."; exit 1; }
            dev-bin/ffmpeg -hide_banner -filters | grep -qw scale_vt || { echo "This ffmpeg has no scale_vt filter, so frames cannot be downsized on the GPU."; exit 1; }
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            dev-bin/ffmpeg.exe -hide_banner -hwaccels | grep -qw d3d11va || { echo "This ffmpeg cannot decode with Direct3D 11."; exit 1; }
          fi

      - name: Test the engine with the ffmpeg that ships
        shell: bash
        run: |
          export PATH="$PWD/dev-bin:$PATH"
          cargo test -p selects_engine --release
          # Show which decoding path this machine used.
          cargo test -p selects_engine --release --test analysis analysis_speed_is_reported -- --nocapture

      - name: Install the Tauri command line tool
        run: npm ci

      - name: Build installer
        shell: bash
        run: |
          # Pasted keys often carry a stray newline or space, which breaks base64 decoding.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          UPDATER_PUBLIC_KEY="$(printf '%s' "$UPDATER_PUBLIC_KEY" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY UPDATER_PUBLIC_KEY
          args=(--target ${{ matrix.target }} --bundles ${{ matrix.bundles }})
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBLIC_KEY" ]; then
            echo "Update signing is set up: building update files too."
            # The bundler checks its update signatures against this key, so it must be in the config too.
            args+=(--config "{\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"pubkey\":\"$UPDATER_PUBLIC_KEY\"}}}")
          else
            echo "Update signing is not set up: this build cannot update itself."
            unset UPDATER_PUBLIC_KEY
          fi
          # On failure, surface the end of the build output as an annotation so it can be read without the log.
          set +e
          npx tauri build "${args[@]}" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            tail -n 25 build.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=tauri build failed::/'
            echo
            exit "$rc"
          fi

      - name: Collect installer and update files
        id: collect
        shell: bash
        run: |
          # Pasted keys often carry a stray newline or space, which breaks base64 decoding.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          UPDATER_PUBLIC_KEY="$(printf '%s' "$UPDATER_PUBLIC_KEY" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY UPDATER_PUBLIC_KEY
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName.replace(/[^A-Za-z0-9]+/g, '-')")
          b=target/${{ matrix.target }}/release/bundle
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            src=$(ls $b/dmg/*.dmg | head -1)
            upd=$(ls $b/macos/*.app.tar.gz 2>/dev/null | head -1 || true)
            upd_out="dist/$name-$version-mac-apple-silicon.app.tar.gz"
          else
            src=$(ls $b/nsis/*-setup.exe | head -1)
            upd="$src"
            upd_out=""
          fi
          out="dist/$name-$version-${{ matrix.asset_suffix }}"
          cp "$src" "$out"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBLIC_KEY" ] && [ -n "$upd" ]; then
            [ -n "$upd_out" ] && cp "$upd" "$upd_out" || upd_out="$out"
            # Sign again with the version bound into the signature, which the app requires.
            npx tauri signer sign --app-version "$version" "$upd_out"
            echo "{\"platform\":\"${{ matrix.platform }}\",\"file\":\"$(basename "$upd_out")\",\"signature\":\"$(cat "$upd_out.sig")\"}" > "dist/update-${{ matrix.platform }}.json"
            rm "$upd_out.sig"
          fi
          ls -la dist
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="v$version"; fi
          if [ "$tag" != "v$version" ]; then
            echo "The tag $tag does not match version $version in src-tauri/tauri.conf.json. Update the version, then tag again."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          # Only the installers. The Windows ffmpeg build is an input to the
          # installer, not something to attach to the release.
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Write the update manifest
        run: node scripts/write-update-manifest.mjs dist "${{ steps.tag.outputs.tag }}" "${{ github.repository }}"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          rm -f dist/update-*.json
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Creates the tag on this commit too, when it does not exist yet.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$name $TAG" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json url,assets -q '.url, .assets[].name'
