<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="../../ui/theme.js"></script>
  <link rel="stylesheet" href="../../ui/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../ui/icon.svg" alt="">
      <span class="wordmark" data-product-name></span>
      <span class="rule"></span>
      <button class="project-btn" id="project-btn" aria-haspopup="menu" aria-expanded="false"><span class="name" id="project-name">New project</span><svg class="icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 5.2L7 8.8l3.5-3.6"/></svg></button>
      <span class="save-state" id="save-state"></span>
    </div>
    <div class="totals" id="totals" aria-live="polite"></div>
    <div class="topbar-actions">
      <button class="btn quiet sm" id="btn-report">Shoot report</button>
      <button class="btn sec sm" id="btn-save">Save</button>
      <button class="btn sm" id="btn-export-top">Export</button>
    </div>
  </header>

  <div class="progress-bar" id="progress-bar" aria-live="polite" hidden>
    <div class="progress-text" id="progress-text"></div>
    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <button class="btn sec xs" id="btn-analysis"></button>
  </div>

  <main class="layout">
    <section class="panel" id="main-panel"></section>
    <aside class="panel side" id="side">
      <div class="side-tabs"><div class="tabs" id="side-tabs" role="tablist" aria-label="Settings"></div></div>
      <div class="side-body" id="side-body"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="drop-overlay" id="drop-overlay" hidden>
    <div class="drop-card">
      <svg class="icon icon-lg" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v7M4 6l3 3 3-3M2.5 11.5h9"/></svg>
      <div>Drop to add this footage</div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="mock.js"></script><script src="../../ui/app.js"></script>
</body>
</html>
