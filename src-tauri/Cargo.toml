[package]
name = "footage-selects"
version = "0.1.0"
edition = "2021"
description = "Pulls selects from raw footage with classical image math, fully offline"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
selects_engine = { path = "../engine" }
