[package]
name = "footage-selects"
version = "0.2.8"
edition = "2021"
description = "Pulls selects from raw footage with classical image math, fully offline"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
selects_engine = { path = "../engine" }
